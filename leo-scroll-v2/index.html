<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Descent v2 demo</title>
<style>
:root{--y:#f6e81e;--c:#19e3f5;--ink:#04070b}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--ink);color:#fff;font-family:system-ui,sans-serif}
.hero,.avenue{height:100vh;display:grid;place-items:center;font-size:32px;letter-spacing:.2em}
.hero{background:linear-gradient(#c9b300,#04070b)}
#descent{height:600vh;position:relative}
.stage{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;background:#000}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
/* soft handoff: hero fades into the first frame, last frame fades into the avenue */
.stage::before,.stage::after{content:"";position:absolute;left:0;right:0;height:22vh;z-index:2;pointer-events:none}
.stage::before{top:0;background:linear-gradient(var(--ink),transparent)}
.stage::after{bottom:0;background:linear-gradient(transparent,var(--ink))}
.alt{position:absolute;right:5vw;top:14vh;z-index:3;font:700 14px/1.2 ui-monospace,monospace;color:var(--c);letter-spacing:.2em;text-align:right}
.alt b{display:block;font-size:34px;color:var(--y);letter-spacing:.05em}
.bar{position:absolute;left:0;top:0;height:3px;width:100%;background:var(--y);transform:scaleX(0);transform-origin:left;z-index:4}
.ch{position:absolute;left:50%;bottom:14vh;transform:translate(-50%,14px);z-index:3;font:700 clamp(26px,5vw,60px)/1.05 system-ui;text-align:center;opacity:0;transition:.5s;text-shadow:0 4px 30px #000}
.ch.on{opacity:1;transform:translate(-50%,0)}
.load{position:fixed;left:0;bottom:0;height:2px;background:var(--c);z-index:9;transition:opacity .4s}
</style></head><body>
<div class="hero">HERO (main-hero.mp4 yahan)</div>
<section id="descent" aria-label="Cinematic city descent">
  <div class="stage"><canvas id="c" aria-label="Cinematic city descent animation"></canvas>
    <div class="bar" id="bar"></div>
    <div class="alt">ALTITUDE<b id="alt">840 M</b></div>
    <div class="ch" data-s=".03" data-e=".23">THE CITY NEVER SLEEPS</div>
    <div class="ch" data-s=".28" data-e=".48">WATCHING FROM ABOVE</div>
    <div class="ch" data-s=".53" data-e=".73">SWING INTO THE NIGHT</div>
    <div class="ch" data-s=".78" data-e=".97">TOUCHDOWN</div>
  </div>
</section>
<div class="avenue">THE CYBERPUNK AVENUE</div>
<div class="load" id="load" style="width:0"></div>
<script src="scrub.js"></script>
<script>
const bar=document.getElementById('bar'),alt=document.getElementById('alt'),chs=[...document.querySelectorAll('.ch')],ld=document.getElementById('load');
history.scrollRestoration='manual';
window.sd=new ScrollDescent({
  section:document.getElementById('descent'),canvas:document.getElementById('c'),frameCount:240,
  path:i=>`frames/f_${String(i+1).padStart(4,'0')}.webp`,
  onProgress:p=>{bar.style.transform=`scaleX(${p})`;alt.textContent=Math.round(840-(840-12)*p)+' M';
    chs.forEach(e=>e.classList.toggle('on',p>=+e.dataset.s&&p<=+e.dataset.e));},
  onLoad:p=>{ld.style.width=p*100+'%';if(p>=1)ld.style.opacity=0;}
});
</script></body></html>
