<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>ProtoFos 2026 · Events & Competitions Arena</title>

  <!-- Google Fonts: Chakra Petch & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,500;0,700;1,700&family=JetBrains+Mono:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #05060A;
      --y: #FFE600;
      --c: #00F0FF;
      --m: #FF2BD6;
      --text: #E8ECF4;
      --mu: #8A93A6;
      --ln: #ffffff1c;
      --card-bg: #080b12ee;
      --comp-bg: none;
      --hex-w: 190px;
      --hex-h: calc(var(--hex-w) * 1.155);
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      line-height: 1.7;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient scanline overlay across page */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 90;
      background: repeating-linear-gradient(
        0deg,
        transparent 0 2px,
        rgba(0, 0, 0, 0.45) 2px 3px
      );
      opacity: 0.55;
    }

    /* Typography Hierarchy */
    .eb {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      font-size: 11px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--y);
      display: inline-flex;
      align-items: center;
      margin-bottom: 6px;
    }

    .eb::before {
      content: "▍";
      color: var(--y);
      margin-right: 8px;
    }

    h2 {
      font-family: 'Chakra Petch', sans-serif;
      font-weight: 700;
      font-style: italic;
      font-size: clamp(2.3rem, 6.4vw, 4.8rem);
      line-height: 0.95;
      text-transform: uppercase;
      letter-spacing: -0.01em;
      color: #FFFFFF;
    }

    h2 b, .y-glow {
      color: var(--y);
      text-shadow: 0 0 30px rgba(255, 230, 0, 0.55);
    }

    h3 {
      font-family: 'Chakra Petch', sans-serif;
      font-weight: 700;
      font-style: italic;
      font-size: 1.35rem;
      line-height: 1.15;
      text-transform: uppercase;
      color: #FFFFFF;
    }

    /* =========================================================================
       SECTION A: EVENTS TUNNEL (#events)
       ========================================================================= */
    #events {
      position: relative;
      height: 700vh;
      width: 100%;
      background: var(--bg);
    }

    .stick {
      position: sticky;
      top: 0;
      height: 100vh;
      height: 100svh;
      width: 100%;
      overflow: hidden;
    }

    #bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Soft top & bottom fades into #05060A + central radial vignette */
    .shade {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 50% 52%, transparent 32%, rgba(5, 6, 10, 0.78) 100%),
        linear-gradient(to bottom, #05060A 0%, rgba(5, 6, 10, 0.6) 14%, transparent 28%, transparent 72%, rgba(5, 6, 10, 0.8) 88%, #05060A 100%);
      z-index: 2;
    }

    /* Top HUD: Eyebrow + H2 (Never overlaps cards: ~6vh clearance) */
    .events-hud {
      position: absolute;
      top: calc(26px + env(safe-area-inset-top, 0px));
      left: 0;
      right: 0;
      text-align: center;
      z-index: 10;
      pointer-events: none;
      padding: 0 16px;
    }

    /* 3D Perspective Card Stage */
    #cards {
      position: absolute;
      inset: 0;
      perspective: 900px;
      transform-style: preserve-3d;
      z-index: 4;
    }

    /* Floating Portrait Event Card */
    .ec {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(290px, 72vw);
      height: min(430px, 60vh);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
      padding: 18px;
      background: var(--card-bg);
      border: 2px solid rgba(255, 255, 255, 0.22);
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.85), 0 0 15px rgba(0, 240, 255, 0.15);
      clip-path: polygon(
        0 0,
        calc(100% - 18px) 0,
        100% 18px,
        100% 100%,
        18px 100%,
        0 calc(100% - 18px)
      );
      cursor: pointer;
      user-select: none;
      will-change: transform, opacity, filter;
      transition: border-color 0.25s, box-shadow 0.25s;
    }

    .ec:hover,
    .ec:focus-visible {
      outline: none;
      border-color: var(--c);
      box-shadow: 0 0 35px rgba(0, 240, 255, 0.6), 0 0 15px rgba(255, 230, 0, 0.4);
    }

    .ec.on {
      border-color: #FFFFFF;
      box-shadow: 0 0 45px rgba(255, 230, 0, 0.55), 0 0 20px rgba(255, 255, 255, 0.8);
    }

    .ec .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.18em;
      color: var(--c);
    }

    .ec .top .y {
      color: var(--y);
    }

    /* Swappable Art Panel with large outlined magenta code */
    .ec .art {
      flex: 1;
      min-height: 140px;
      display: grid;
      place-items: center;
      border: 1px solid var(--ln);
      background: 
        repeating-linear-gradient(0deg, transparent 0 2px, rgba(0, 0, 0, 0.35) 2px 4px),
        linear-gradient(145deg, #2a0a45 0%, #0d0718 55%, #05060A 100%);
      position: relative;
      overflow: hidden;
    }

    .ec .art span {
      font-family: 'Chakra Petch', sans-serif;
      font-weight: 700;
      font-style: italic;
      font-size: 3.5rem;
      color: transparent;
      -webkit-text-stroke: 1.5px var(--m);
      text-shadow: 0 0 24px rgba(255, 43, 214, 0.7);
      letter-spacing: 0.05em;
    }

    .ec p {
      font-size: 12px;
      color: var(--mu);
      line-height: 1.55;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .ec .ft {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.16em;
      color: var(--mu);
      border-top: 1px solid var(--ln);
      padding-top: 8px;
    }

    /* Bottom HUD Progress Counter */
    .events-prog {
      position: absolute;
      bottom: calc(24px + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 10;
      pointer-events: none;
      user-select: none;
    }

    .events-prog b {
      display: block;
      font-family: 'Chakra Petch', sans-serif;
      font-weight: 700;
      font-style: italic;
      font-size: 2rem;
      line-height: 1;
      color: var(--y);
      text-shadow: 0 0 20px rgba(255, 230, 0, 0.5);
      margin-bottom: 2px;
    }

    .events-prog span {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--mu);
    }

    /* =========================================================================
       SECTION B: COMPETITIONS HONEYCOMB GRID (#competitions)
       ========================================================================= */
    #competitions {
      position: relative;
      background: transparent;
      padding: 110px 24px 140px;
      max-width: 1320px;
      margin: 0 auto;
      z-index: 10;
    }

    /* Background layer controllable via --comp-bg */
    .comp-bg {
      position: absolute;
      inset: 0;
      z-index: -1;
      background: var(--comp-bg);
      pointer-events: none;
    }

    .comp-bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(5,6,10,0.6) 0%, rgba(5,6,10,0.92) 100%);
    }

    .comp-layout {
      display: grid;
      grid-template-columns: 230px 1fr;
      gap: 48px;
      align-items: start;
    }

    @media (max-width: 820px) {
      .comp-layout {
        grid-template-columns: 1fr;
        gap: 32px;
      }
    }

    /* Sidebar Categories */
    .comp-sidebar {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .comp-sidebar-title {
      margin-bottom: 6px;
    }

    .comp-filter-btn {
      all: unset;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 14px;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      font-size: 12px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--text);
      background: #080b12cc;
      border: 1px solid var(--ln);
      border-left: 3px solid transparent;
      cursor: pointer;
      transition: all 0.2s ease;
      clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 0 100%);
    }

    .comp-filter-btn:hover,
    .comp-filter-btn:focus-visible {
      color: var(--y);
      border-left-color: var(--y);
      background: rgba(255, 230, 0, 0.08);
      outline: none;
    }

    .comp-filter-btn.active {
      color: var(--y);
      border-left-color: var(--y);
      background: rgba(255, 230, 0, 0.12);
      text-shadow: 0 0 12px rgba(255, 230, 0, 0.4);
    }

    .comp-filter-btn .badge {
      color: var(--mu);
      font-size: 11px;
    }

    .comp-filter-btn.active .badge {
      color: var(--y);
    }

    /* Content Area */
    .comp-content-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding-bottom: 16px;
      margin-bottom: 38px;
      border-bottom: 1px solid var(--ln);
    }

    .comp-content-header h3 {
      font-size: clamp(1.4rem, 2.6vw, 2.2rem);
      color: #FFFFFF;
    }

    .comp-arenas-badge {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      font-size: 11px;
      letter-spacing: 0.2em;
      color: var(--y);
      text-transform: uppercase;
      background: rgba(255, 230, 0, 0.1);
      padding: 4px 10px;
      border: 1px solid rgba(255, 230, 0, 0.3);
      clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 6px, 100% 100%, 6px 100%, 0 calc(100% - 6px));
    }

    /* Honeycomb Hexagon Grid */
    .comp-honeycomb-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    .hex-row {
      display: flex;
      justify-content: center;
      gap: 16px;
      width: 100%;
    }

    /* Rows overlap vertically by 17% of hex height */
    .hex-row.hex-overlap {
      margin-top: calc(-1 * 0.17 * var(--hex-h));
    }

    /* Outer wrapper holds drop-shadow so clip-path doesn't crop it */
    .hex-tile-wrap {
      width: var(--hex-w);
      height: var(--hex-h);
      cursor: pointer;
      user-select: none;
      transition: transform 0.25s ease, filter 0.25s ease;
      will-change: transform, filter;
    }

    .hex-tile-wrap:hover,
    .hex-tile-wrap:focus-visible {
      transform: translateY(-5px);
      filter: drop-shadow(0 0 25px rgba(255, 230, 0, 0.55)) drop-shadow(0 0 10px rgba(0, 240, 255, 0.4));
      outline: none;
    }

    /* Border hex with 2px cyan-to-yellow gradient */
    .hex-border {
      width: 100%;
      height: 100%;
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      background: linear-gradient(135deg, var(--c) 0%, #157aff 40%, var(--y) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2px;
    }

    /* Inner hex container with dark gradient fill */
    .hex-inner {
      width: 100%;
      height: 100%;
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      background: 
        repeating-linear-gradient(0deg, transparent 0 2px, rgba(0, 0, 0, 0.3) 2px 4px),
        linear-gradient(175deg, #0e1526 0%, #060912 60%, #04060b 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 16px 14px;
      gap: 6px;
    }

    .hex-code {
      font-family: 'Chakra Petch', sans-serif;
      font-weight: 700;
      font-style: italic;
      font-size: 2.2rem;
      line-height: 1;
      color: transparent;
      -webkit-text-stroke: 1.2px var(--m);
      text-shadow: 0 0 16px rgba(255, 43, 214, 0.6);
      margin-bottom: 2px;
    }

    .hex-title {
      font-size: 0.95rem;
      line-height: 1.15;
      color: #FFFFFF;
      max-width: 140px;
    }

    .hex-cat {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      font-size: 9px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--y);
      margin-top: 4px;
    }

    /* Staggered Pop Animation */
    @keyframes hexPop {
      0% {
        opacity: 0;
        transform: scale(0.8);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    .hex-tile-wrap.pop-in {
      animation: hexPop 0.35s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @media (max-width: 640px) {
      :root {
        --hex-w: 150px;
      }
      .hex-code {
        font-size: 1.8rem;
      }
      .hex-title {
        font-size: 0.82rem;
        max-width: 110px;
      }
    }

    /* =========================================================================
       SHARED DETAIL DRAWER (#dr & #ov)
       ========================================================================= */
    #ov {
      position: fixed;
      inset: 0;
      background: rgba(4, 6, 11, 0.82);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }

    body.drawer-open #ov {
      opacity: 1;
      pointer-events: auto;
    }

    #dr {
      position: fixed;
      top: 0;
      right: 0;
      height: 100%;
      height: 100svh;
      width: min(500px, 100%);
      z-index: 105;
      background: #080b11;
      border-left: 2px solid var(--y);
      box-shadow: -15px 0 50px rgba(0, 0, 0, 0.9);
      display: flex;
      flex-direction: column;
      transform: translateX(102%);
      transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
      overflow: hidden;
    }

    body.drawer-open #dr {
      transform: translateX(0);
    }

    .dr-header {
      display: flex;
      justify-content: flex-end;
      padding: 20px 24px 12px;
      border-bottom: 1px solid var(--ln);
    }

    .dr-close-btn {
      all: unset;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      font-size: 11px;
      letter-spacing: 0.2em;
      color: var(--mu);
      cursor: pointer;
      padding: 6px 12px;
      border: 1px solid var(--ln);
      clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 6px, 100% 100%, 6px 100%, 0 calc(100% - 6px));
      transition: all 0.2s;
    }

    .dr-close-btn:hover {
      color: var(--y);
      border-color: var(--y);
      background: rgba(255, 230, 0, 0.1);
    }

    .dr-body {
      flex: 1;
      overflow-y: auto;
      padding: 26px 28px 40px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .dr-body::-webkit-scrollbar {
      width: 5px;
    }
    .dr-body::-webkit-scrollbar-thumb {
      background: #1e293b;
    }

    .dr-eyebrow {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      font-size: 11px;
      letter-spacing: 0.24em;
      color: var(--c);
    }

    .dr-title {
      font-size: clamp(1.8rem, 3.2vw, 2.5rem);
      line-height: 1.05;
      color: #FFFFFF;
      text-shadow: 0 0 25px rgba(255, 255, 255, 0.3);
    }

    .dr-tagline {
      font-style: italic;
      color: var(--y);
      font-size: 13.5px;
      margin-top: -6px;
    }

    .dr-desc {
      color: #B4BCD0;
      font-size: 13.5px;
      line-height: 1.7;
      margin: 8px 0;
    }

    .dr-section-label {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      font-size: 10px;
      letter-spacing: 0.22em;
      color: var(--c);
      text-transform: uppercase;
      padding-top: 14px;
      border-top: 1px solid var(--ln);
    }

    /* Definition List */
    .dr-dl {
      display: grid;
      grid-template-columns: 100px 1fr;
      gap: 10px 14px;
      font-size: 12.5px;
      margin-bottom: 8px;
    }

    .dr-dl dt {
      color: var(--mu);
      font-weight: 600;
      letter-spacing: 0.12em;
      font-size: 11px;
    }

    .dr-dl dd {
      color: #FFFFFF;
    }

    .dr-dl dd.y-bold {
      color: var(--y);
      font-weight: 600;
    }

    /* Prize Boxes */
    .dr-prizes {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 6px;
    }

    .prize-card {
      background: #0e1422;
      border: 1px solid var(--ln);
      padding: 12px 8px;
      text-align: center;
      clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 6px, 100% 100%, 6px 100%, 0 calc(100% - 6px));
    }

    .prize-card.gold {
      border-color: rgba(255, 230, 0, 0.4);
      background: rgba(255, 230, 0, 0.05);
    }

    .prize-rank {
      display: block;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.16em;
      color: var(--mu);
      margin-bottom: 4px;
    }

    .prize-card.gold .prize-rank {
      color: var(--y);
    }

    .prize-amt {
      font-family: 'Chakra Petch', sans-serif;
      font-weight: 700;
      font-style: italic;
      font-size: 1.25rem;
      color: var(--y);
    }

    /* Rules List */
    .dr-rules {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .dr-rules li {
      display: flex;
      gap: 10px;
      font-size: 12.5px;
      color: #C0C8DA;
      line-height: 1.55;
    }

    .dr-rules .bullet {
      color: var(--c);
      font-size: 10px;
      margin-top: 4px;
    }

    .dr-coordinators {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--ln);
      padding: 12px 14px;
      font-size: 11px;
      color: var(--mu);
      display: flex;
      flex-direction: column;
      gap: 4px;
      clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 6px, 100% 100%, 0 100%);
    }

    .dr-coordinators b {
      color: var(--text);
    }

    .dr-cta-row {
      margin-top: 10px;
    }

    .dr-reg-btn {
      all: unset;
      width: 100%;
      display: block;
      text-align: center;
      padding: 14px 0;
      font-family: 'Chakra Petch', sans-serif;
      font-weight: 700;
      font-style: italic;
      font-size: 1.1rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #05060A;
      background: var(--y);
      cursor: pointer;
      box-shadow: 0 0 25px rgba(255, 230, 0, 0.5);
      clip-path: polygon(
        0 0,
        calc(100% - 12px) 0,
        100% 12px,
        100% 100%,
        12px 100%,
        0 calc(100% - 12px)
      );
      transition: all 0.25s ease;
    }

    .dr-reg-btn:hover {
      background: #FFFFFF;
      box-shadow: 0 0 35px rgba(255, 255, 255, 0.7);
    }

    /* prefers-reduced-motion accessibility */
    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
      #events {
        height: auto;
      }
      .stick {
        position: relative;
        height: auto;
      }
      #cards {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 24px;
        padding: 40px 16px;
      }
      .ec {
        position: relative;
        left: 0;
        top: 0;
        transform: none !important;
        opacity: 1 !important;
        filter: none !important;
      }
    }
  </style>
</head>
<body>

  <!-- SECTION A: EVENTS INFINITE ZOOM TUNNEL -->
  <section id="events" aria-label="Events Arena Infinite Zoom Tunnel">
    <div class="stick">
      <canvas id="bg" aria-hidden="true"></canvas>
      <div class="shade" aria-hidden="true"></div>

      <!-- Top Clearance HUD -->
      <div class="events-hud">
        <div class="eb">▍03 · EVENTS</div>
        <h2>ENTER THE <b class="y-glow">ARENA</b></h2>
      </div>

      <!-- Floating 3D Event Cards Container -->
      <div id="cards" role="region" aria-label="Interactive Event Cards"></div>

      <!-- Bottom Progress HUD -->
      <div class="events-prog">
        <b id="pn">01 / 06</b>
        <span id="pt">SYNAPSE ARENA</span>
      </div>
    </div>
  </section>

  <!-- SECTION B: COMPETITIONS HONEYCOMB GRID -->
  <section id="competitions" aria-label="Competitions Battlefield">
    <!-- Controllable background layer via --comp-bg -->
    <div class="comp-bg" aria-hidden="true"></div>

    <div class="comp-layout">
