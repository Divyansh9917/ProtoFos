<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scroll Scrub</title>
<style>
  :root{
    --bg:#05070a; --fg:#f4f6f8; --accent:#f2e44a;
    color-scheme: dark;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:var(--bg)}
  body{
    background:var(--bg); color:var(--fg);
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  /* Scroll length = how long the video takes to play. Increase for slower scrubbing. */
  .scroll-space{ height:600vh; position:relative; }

  .stage{
    position:sticky; top:0; height:100vh; height:100svh; width:100%;
    overflow:hidden; background:#000;
  }
  canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; }

  /* cinematic vignette so text stays readable */
  .stage::after{
    content:""; position:absolute; inset:0; pointer-events:none;
    background:
      radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%),
      linear-gradient(to bottom, rgba(0,0,0,.35), transparent 22%, transparent 70%, rgba(0,0,0,.55));
  }

  /* chapter text */
  .chapter{
    position:absolute; left:50%; bottom:12vh; transform:translate(-50%,16px);
    width:min(90vw,760px); text-align:center; z-index:2;
    opacity:0; transition:opacity .5s ease, transform .5s ease;
    pointer-events:none; will-change:opacity,transform;
  }
  .chapter.on{ opacity:1; transform:translate(-50%,0); }
  .chapter small{
    display:block; letter-spacing:.35em; text-transform:uppercase;
    font-size:clamp(10px,1.2vw,12px); color:var(--accent); margin-bottom:.9em;
  }
  .chapter h2{
    font-weight:700; line-height:1.05; letter-spacing:-.02em;
    font-size:clamp(28px,5.5vw,64px); text-shadow:0 4px 30px rgba(0,0,0,.7);
  }

  /* progress bar */
  .bar{ position:absolute; left:0; top:0; height:3px; width:100%; z-index:3; background:rgba(255,255,255,.08); }
  .bar i{ display:block; height:100%; width:100%; background:var(--accent); transform:scaleX(0); transform-origin:left; will-change:transform; }

  /* scroll hint */
  .hint{
    position:absolute; left:50%; bottom:max(24px, env(safe-area-inset-bottom,0px)); transform:translateX(-50%);
    z-index:3; display:flex; flex-direction:column; align-items:center; gap:10px;
    font-size:11px; letter-spacing:.3em; text-transform:uppercase; color:rgba(255,255,255,.75);
    transition:opacity .4s ease; pointer-events:none;
  }
  .hint.hide{ opacity:0; }
  .mouse{ width:22px; height:36px; border:1.5px solid rgba(255,255,255,.7); border-radius:12px; position:relative; }
  .mouse::after{
    content:""; position:absolute; left:50%; top:7px; width:3px; height:7px; margin-left:-1.5px;
    border-radius:2px; background:#fff; animation:wheel 1.6s infinite;
  }
  @keyframes wheel{ 0%{opacity:0;transform:translateY(0)} 30%{opacity:1} 100%{opacity:0;transform:translateY(12px)} }

  /* loader */
  .loader{
    position:fixed; inset:0; z-index:10; background:var(--bg);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;
    transition:opacity .6s ease, visibility .6s;
  }
  .loader.done{ opacity:0; visibility:hidden; }
  .loader .track{ width:min(60vw,260px); height:2px; background:rgba(255,255,255,.12); overflow:hidden; border-radius:2px; }
  .loader .fill{ height:100%; width:100%; background:var(--accent); transform:scaleX(0); transform-origin:left; transition:transform .15s linear; }
  .loader p{ font-size:11px; letter-spacing:.3em; text-transform:uppercase; color:rgba(255,255,255,.6); }

  .end{ height:40vh; display:grid; place-items:center; color:rgba(255,255,255,.5); font-size:13px; letter-spacing:.2em; text-transform:uppercase; }

  @media (prefers-reduced-motion: reduce){
    .mouse::after{ animation:none }
    .chapter{ transition:none }
  }
</style>
</head>
<body>

<div class="loader" id="loader">
  <div class="track"><div class="fill" id="loadFill"></div></div>
  <p id="loadText">Loading 0%</p>
</div>

<div class="scroll-space" id="space">
  <div class="stage">
    <canvas id="c"></canvas>
    <div class="bar"><i id="bar"></i></div>

    <!-- Edit / remove these chapters freely. start/end are scroll progress (0 to 1). -->
    <div class="chapter" data-start="0.02" data-end="0.22"><small>Chapter 01</small><h2>The city never sleeps</h2></div>
    <div class="chapter" data-start="0.27" data-end="0.47"><small>Chapter 02</small><h2>Watching from above</h2></div>
    <div class="chapter" data-start="0.52" data-end="0.72"><small>Chapter 03</small><h2>Swing into the night</h2></div>
    <div class="chapter" data-start="0.78" data-end="0.98"><small>Chapter 04</small><h2>Touchdown</h2></div>

    <div class="hint" id="hint"><div class="mouse"></div><span>Scroll</span></div>
  </div>
</div>
<div class="end">End</div>

<script>
(() => {
  /* ===== CONFIG ===== */
  const FRAME_COUNT = 240;
  const framePath   = i => `frames/f_${String(i + 1).padStart(4, '0')}.webp`;
  const SMOOTHING   = 0.14;   // 0.05 = very floaty, 0.3 = snappy, 1 = no smoothing
  const MAX_DPR     = 2;      // cap pixel ratio so big screens don't lag

  /* ===== ELEMENTS ===== */
  const canvas = document.getElementById('c');
  const ctx    = canvas.getContext('2d', { alpha: false });
  const space  = document.getElementById('space');
  const bar    = document.getElementById('bar');
  const hint   = document.getElementById('hint');
  const loader = document.getElementById('loader');
  const loadFill = document.getElementById('loadFill');
  const loadText = document.getElementById('loadText');
  const chapters = [...document.querySelectorAll('.chapter')];

  const frames = new Array(FRAME_COUNT);   // HTMLImageElement (decoded)
  let loaded = 0;
  let cw = 0, ch = 0;                      // canvas size in device px
  let target = 0, current = 0, lastDrawn = -1;
  let ticking = false;

  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';

  /* ===== CANVAS SIZE ===== */
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, MAX_DPR);
    cw = Math.round(canvas.clientWidth  * dpr);
    ch = Math.round(canvas.clientHeight * dpr);
    canvas.width = cw; canvas.height = ch;
    lastDrawn = -1;                        // force redraw
    draw(Math.round(current));
  }

  /* ===== DRAW (object-fit: cover) ===== */
  function draw(index) {
    index = Math.max(0, Math.min(FRAME_COUNT - 1, index));
    // use the nearest already-loaded frame (looks fine while still preloading)
    let img = frames[index];
    if (!img) {
      for (let d = 1; d < FRAME_COUNT && !img; d++) {
        img = frames[index - d] || frames[index + d];
      }
    }
    if (!img || index === lastDrawn) return;
    lastDrawn = index;

    const iw = img.naturalWidth, ih = img.naturalHeight;
    const scale = Math.max(cw / iw, ch / ih);
    const w = iw * scale, h = ih * scale;
    ctx.drawImage(img, (cw - w) / 2, (ch - h) / 2, w, h);
  }

  /* ===== SCROLL PROGRESS ===== */
  function progress() {
    const max = space.offsetHeight - window.innerHeight;
    const p = (window.scrollY - space.offsetTop) / max;
    return Math.min(1, Math.max(0, p));
  }

  function updateUI(p) {
    bar.style.transform = `scaleX(${p})`;
    hint.classList.toggle('hide', p > 0.015);
    for (const el of chapters) {
      const on = p >= +el.dataset.start && p <= +el.dataset.end;
      el.classList.toggle('on', on);
    }
  }

  /* ===== RENDER LOOP (only runs while moving) ===== */
  function loop() {
    const diff = target - current;
    if (Math.abs(diff) < 0.01) {
      current = target;
      draw(Math.round(current));
      ticking = false;
      return;
    }
    current += diff * SMOOTHING;
    draw(Math.round(current));
    requestAnimationFrame(loop);
  }

  function onScroll() {
    const p = progress();
    target = p * (FRAME_COUNT - 1);
    updateUI(p);
    if (!ticking) { ticking = true; requestAnimationFrame(loop); }
  }

  /* ===== PRELOAD ===== */
  function loadFrame(i) {
    return new Promise(resolve => {
      const img = new Image();
      img.decoding = 'async';
      img.src = framePath(i);
      const done = () => {
        frames[i] = img;
        loaded++;
        const pct = Math.round(loaded / FRAME_COUNT * 100);
        loadFill.style.transform = `scaleX(${pct / 100})`;
        loadText.textContent = `Loading ${pct}%`;
        resolve();
      };
      // decode() so the first draw never stalls on decoding
      (img.decode ? img.decode() : Promise.resolve()).then(done, done);
    });
  }

  async function preload() {
    // 1) first frame immediately so the page is never blank
    await loadFrame(0);
    resize();

    // 2) load the rest in parallel batches, spread evenly (every 4th first, then fill gaps)
    const order = [];
    for (let step of [8, 4, 2, 1]) {
      for (let i = 0; i < FRAME_COUNT; i += step) if (!order.includes(i)) order.push(i);
    }
    const queue = order.filter(i => i !== 0);
    const CONCURRENCY = 8;
    let cursor = 0;
    const worker = async () => {
      while (cursor < queue.length) await loadFrame(queue[cursor++]);
    };
    await Promise.all(Array.from({ length: CONCURRENCY }, worker));

    loader.classList.add('done');
    onScroll();
  }

  /* ===== INIT ===== */
  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', () => { resize(); onScroll(); });
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  window.scrollTo(0, 0);
  preload();
})();
</script>
</body>
</html>
